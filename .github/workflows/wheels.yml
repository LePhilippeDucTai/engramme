name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: wheel-macos-arm64
          - os: windows-latest
            artifact: wheel-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m crates/engramme-py/Cargo.toml
          rust-toolchain: stable
      # setup-uv publishes no major tag after v7: pin the release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - name: Install the wheel with pip on Python 3.9 and run engramme check
        shell: bash
        run: |
          uv venv --python 3.9 --seed .venv-test
          if [ "$RUNNER_OS" = Windows ]; then bin=.venv-test/Scripts; else bin=.venv-test/bin; fi
          "$bin/python" -m pip install --no-index dist/*.whl
          "$bin/engramme" --version
          summary=$("$bin/engramme" check examples/savoir)
          echo "$summary"
          test "$summary" = "checked 6 files: 0 errors, 0 warnings"
          status=0
          "$bin/engramme" check crates/engramme-cli/tests/fixtures/broken > broken.txt || status=$?
          cat broken.txt
          test "$status" -eq 1
          grep -q 'pd.md:12: error:' broken.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Check that the wheels carry the version of the tag
        run: ls dist/engramme-"${GITHUB_REF_NAME#v}"-*.whl
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            skill/SKILL.md
            skill/INSTALL.md
          fail_on_unmatched_files: true
          generate_release_notes: true
