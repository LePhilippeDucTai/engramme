[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LePhilippeDucTai/engramme"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
