[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "engramme"
description = "Check an engramme vault: Markdown notes with flashcards, and agent proposals"
requires-python = ">=3.9"
license = "MIT"
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/LePhilippeDucTai/engramme"

[project.scripts]
engramme = "engramme:main"

[tool.maturin]
bindings = "pyo3"
